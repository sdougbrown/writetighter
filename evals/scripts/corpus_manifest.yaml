# Real multilingual source files for the whole-file code-comment evaluation.
# Paths resolve from the WriteTighter repository root (`repo_root: ../..`).
# URL and revision identify a public checkout that contains the locked source;
# local paths remain configurable by editing a manifest copy passed via --manifest.
# The snapshot and lockfile are generated locally; source copies are gitignored.

repo_root: ../..
output: evals/fixtures/code-comments/seed/_corpus
lockfile: evals/fixtures/code-comments/corpus.lock.json

repos:
  - id: writetighter
    path: .
    url: https://github.com/sdougbrown/writetighter.git
    revision: 23485397ef12400dc07422e1f38dfaeeb435d437
    language: go
    files:
      - internal/guidance/guidance.go

  - id: avenor
    path: ../avenor
    url: https://github.com/sdougbrown/avenor.git
    revision: 37ccb100be5fbe33ce4fbdfe8047aeac72a63ac1
    language: go
    files:
      - internal/digest/accumulate.go

  - id: umpire
    path: ../umpire
    url: https://github.com/umpire-tools/umpire.git
    revision: aa7a76f2a5b1d8962357e8469506c6d8c2a9c129
    language: ts
    files:
      - packages/core/src/graph.ts

  - id: daywatch-cal-ts
    path: ../daywatch-cal
    url: https://github.com/sdougbrown/daywatch-cal.git
    revision: 497599f673df2f064b17dbd48db05a39c2d55882
