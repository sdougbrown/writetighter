# Consumer-owned Longe driver package for the WriteTighter code-comment eval.
#
# Installed into the same venv as `longe` so the `longe.drivers` entry point
# resolves. Stdlib-only at runtime; `longe` is provided by the shared venv.
[project]
name = "wt-evals"
version = "0.1.0"
description = "Longe driver comparing WriteTighter revise --kind code-comment against a code-aware direct prompt"
readme = "README.md"
requires-python = ">=3.11"
# `longe` is not a dependency here: wt-evals is installed into the longe venv,
# where longe is already importable. Longe core is never modified.
dependencies = ["pyyaml>=6.0"]

[project.entry-points."longe.drivers"]
wt-coderev = "wt_evals.driver:WTCommentDriver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wt_evals"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
