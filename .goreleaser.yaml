# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: writetighter

before:
  hooks:
    - go mod tidy

builds:
  - id: writetighter
    binary: writetighter
    main: ./cmd/writetighter
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/sdougbrown/writetighter/internal/app.commit={{.Commit}} -X github.com/sdougbrown/writetighter/internal/app.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: writetighter
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  disable: true
